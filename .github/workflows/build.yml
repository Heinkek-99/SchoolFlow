# ============================================
# Pipeline CI/CD pour SchoolFlow
# ============================================

name: SchoolFlow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'SchoolFlow.sln'
  API_PROJECT_PATH: 'src/SchoolFlow.API/SchoolFlow.API.csproj'
  INFRASTRUCTURE_PROJECT_PATH: 'src/SchoolFlow.Infrastructure/SchoolFlow.Infrastructure.csproj'

jobs:
  # ============================================
  # JOB 1 : BUILD & TEST
  # ============================================
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Pour SonarCloud
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: 🔨 Build Solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
    
    - name: 🧪 Run Unit Tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: 📊 Code Coverage Report
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    
    - name: 📦 Publish API Artifact
      run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-build --output ./publish
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: schoolflow-api
        path: ./publish

 
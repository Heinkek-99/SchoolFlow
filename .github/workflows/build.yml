# ============================================
# Pipeline CI/CD pour SchoolFlow
# ============================================

name: SchoolFlow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'SchoolFlow.sln'
  API_PROJECT_PATH: 'src/SchoolFlow.API/SchoolFlow.API.csproj'
  INFRASTRUCTURE_PROJECT_PATH: 'src/SchoolFlow.Infrastructure/SchoolFlow.Infrastructure.csproj'

jobs:
  # ============================================
  # JOB 1 : BUILD & TEST
  # ============================================
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Pour SonarCloud
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: 🔨 Build Solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
    
    - name: 🧪 Run Unit Tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: 📊 Code Coverage Report
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: 📦 Publish API Artifact
      run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-build --output ./publish
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v3.1.0
      with:
        name: schoolflow-api
        path: ./publish

  # ============================================
  # JOB 2 : CODE QUALITY (SonarCloud)
  # ============================================
  code-quality:
    name: 🔍 Code Quality Analysis
    runs-on: windows-latest
    if: github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📊 Setup SonarCloud Scanner
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=edifytech
          -Dsonar.projectKey=edifytech_schoolflow
          -Dsonar.sources=src
          -Dsonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml
    
    - name: 🔨 Build with SonarCloud
      run: |
        dotnet restore ${{ env.SOLUTION_PATH }}
        dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  # ============================================
  # JOB 3 : SECURITY SCAN
  # ============================================
  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔍 Run Snyk Security Scan
      uses: snyk/actions/dotnet@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
    
    - name: 🔍 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: 📤 Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # ============================================
  # JOB 4 : DATABASE MIGRATION CHECK
  # ============================================
  database-check:
    name: 🗄️ Database Migration Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 🔧 Install EF Core Tools
      run: dotnet tool install --global dotnet-ef
    
    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: ✅ Check Migrations
      run: |
        dotnet ef migrations list \
          --project ${{ env.INFRASTRUCTURE_PROJECT_PATH }} \
          --startup-project ${{ env.API_PROJECT_PATH }} \
          --no-build || echo "⚠️ No migrations found"
    
    - name: 🔍 Generate Migration Script
      run: |
        dotnet ef migrations script \
          --project ${{ env.INFRASTRUCTURE_PROJECT_PATH }} \
          --startup-project ${{ env.API_PROJECT_PATH }} \
          --idempotent \
          --output migration-script.sql
    
    - name: 📤 Upload Migration Script
      uses: actions/upload-artifact@v3
      with:
        name: migration-script
        path: migration-script.sql

  # ============================================
  # JOB 5 : DOCKER BUILD
  # ============================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🏗️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🐳 Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/SchoolFlow.API/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/schoolflow-api:latest
          ${{ secrets.DOCKER_USERNAME }}/schoolflow-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ============================================
  # JOB 6 : DEPLOY STAGING
  # ============================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.schoolflow.app
    
    steps:
    - name: 📥 Download Artifacts
      uses: actions/download-artifact@v3
      with:
        name: schoolflow-api
        path: ./publish
    
    - name: 🚀 Deploy to Azure Web App (Staging)
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'schoolflow-api-staging'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        package: ./publish

  # ============================================
  # JOB 7 : DEPLOY PRODUCTION
  # ============================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.schoolflow.app
    
    steps:
    - name: 📥 Download Artifacts
      uses: actions/download-artifact@v3
      with:
        name: schoolflow-api
        path: ./publish
    
    - name: 🚀 Deploy to Azure Web App (Production)
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'schoolflow-api-prod'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
        package: ./publish
    
    - name: 🏥 Health Check
      run: |
        sleep 30
        curl -f https://api.schoolflow.app/health || exit 1
    
    - name: 📢 Notify Success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            text: "✅ SchoolFlow API deployed to Production successfully!",
            blocks: [
              {
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: "🚀 *SchoolFlow API Production Deployment*\n✅ Status: Success\n🔗 <https://api.schoolflow.app|View API>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================
  # JOB 8 : RELEASE NOTES
  # ============================================
  release-notes:
    name: 📝 Generate Release Notes
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 📝 Generate Changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v4
      with:
        configuration: ".github/changelog-config.json"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏷️ Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false
# ============================================
# Pipeline CI/CD pour SchoolFlow
# ============================================

name: SchoolFlow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'SchoolFlow.sln'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  API_PROJECT_PATH: 'src/SchoolFlow.Api/SchoolFlow.Api.csproj'
  INFRASTRUCTURE_PROJECT_PATH: 'src/SchoolFlow.Infrastructure/SchoolFlow.Infrastructure.csproj'

jobs:
  # ============================================
  # JOB 1 : BUILD & TEST
  # ============================================
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Pour SonarCloud
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: 🔨 Build Solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
    
    - name: 🧪 Run Unit Tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: 📊 Code Coverage Report
      uses: codecov/codecov-action@v4
      continue-on-error: true
      if: always()
      with:
        files: ./coverage/**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    
    - name: 📦 Publish API Artifact
      run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-build --output ./publish
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: schoolflow-api
        path: ./publish

  # ============================================
  # JOB 2 : CODE QUALITY (SonarCloud)
  # ============================================
  code-quality:
    name: 🔍 Code Quality Analysis
    runs-on: windows-latest
    if: github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📊 Setup SonarCloud Scanner
      run: dotnet tool install --global dotnet-sonarscanner
      
    - name: 🔍 Begin SonarCloud Analysis
      run: |
        dotnet sonarscanner begin `
          /k:"edifytech_schoolflow" `
          /o:"edifytech" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"

    - name: 🔨 Build with SonarCloud
      run: |
        dotnet restore ${{ env.SOLUTION_PATH }}
        dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  # ============================================
  # JOB 3 : SECURITY SCAN
  # ============================================
  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }} 

    - name: 🔍 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: 🔍 Run Snyk Security Scan
      uses: snyk/actions/dotnet@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --all-projects

  # ============================================
  # JOB 4 : DATABASE MIGRATION CHECK
  # ============================================
  database-check:
    name: 🗄️ Database Migration Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 🔧 Install EF Core Tools
      run: dotnet tool update --global dotnet-ef || dotnet tool install --global dotnet-ef
    
    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: ✅ Check Migrations
      run: |
        dotnet ef migrations list \
          --project ${{ env.INFRASTRUCTURE_PROJECT_PATH }} \
          --startup-project ${{ env.API_PROJECT_PATH }} \
          --no-build || echo "⚠️ No migrations found"
    
    - name: 🔍 Generate Migration Script
      run: |
        dotnet ef migrations script \
          --project ${{ env.INFRASTRUCTURE_PROJECT_PATH }} \
          --startup-project ${{ env.API_PROJECT_PATH }} \
          --idempotent \
          --output migration-script.sql
    
    - name: 📤 Upload Migration Script
      uses: actions/upload-artifact@v4
      with:
        name: migration-script
        path: migration-script.sql

  # ============================================
  # JOB 5 : DOCKER BUILD
  # ============================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🏗️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🐳 Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/SchoolFlow.API/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/schoolflow-api:latest
          ${{ secrets.DOCKER_USERNAME }}/schoolflow-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

services:

  # PostgreSQL
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: SchoolFlowDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: azer
      
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - schoolflow-network

  # SQL Server

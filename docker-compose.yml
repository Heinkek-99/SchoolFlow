    # healthcheck:
    #   # test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'"]
        # >
        # /opt/mssql-tools/bin/sqlcmd
        # -S localhost 

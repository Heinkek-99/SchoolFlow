  # SchoolFlow API
  api:
    build:
      context: .
      dockerfile: src/SchoolFlow.Api/Dockerfile
    container_name: schoolflow-api
    ports:
      - "5294:8084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8084
      - ASPNETCORE_HTTP_PORTS=8084

      # Database connection string
      # - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SchoolFlowDb;Host=postgres;Password=azer;TrustServerCertificate=true;MultipleActiveResultSets=true
      - ConnectionStrings__DefaultConnection=Host=postgres; Port=5432;Database=SchoolFlowDb;Username=postgres; Password=azer
      # JWT Settings
      - JwtSettings__SecretKey=SchoolFlow-Docker-Secret-Key-2025-PRODUCTION-256bits
      - JwtSettings__Issuer=SchoolFlowApi
      - JwtSettings__Audience=SchoolFlowClients
      - JwtSettings__ExpirationHours=8

    depends_on:
      postgres:
        condition: service_started
    networks:
      - schoolflow-network
    volumes:
      - api-logs:/app/logs
      - api-photos:/app/wwwroot/photos
      - api-documents:/app/wwwroot/documents
    restart: unless-stopped

networks:
  schoolflow-network:
    driver: bridge
    # name: schoolflow-network

volumes:
